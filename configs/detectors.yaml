# WARNING: this file is NOT a valid Config.
# It has no `extends`, does not go through the pydantic schema in config.py and cannot be
# used with --config. It is only a source of presets: copy the block of the detector you
# want into evaluate.per_detector_params (or detection.params) of your
# experiment. See configs/experiments/sift_vs_orb_vs_akaze.yaml for an example.
#
# Each block lists only parameters that the matching cv2.<Detector>_create
# accepts; create_detector drops the rest and logs a warning.
# Fair comparison rule: nfeatures must be the SAME in all three blocks.

sift:
  nfeatures: 5000             # keypoint cap, keeping the strongest responses; 0 = no cap
  nOctaveLayers: 3            # layers per octave of the DoG pyramid
  contrastThreshold: 0.04     # drops weak peaks; raising it cleans sky and flat areas
  edgeThreshold: 10           # tolerated curvature ratio; drops responses on straight edges, which localize poorly along the line
  sigma: 1.6                  # blur assumed for the input image at octave zero

orb:
  nfeatures: 5000             # same cap as SIFT, otherwise the comparison becomes one of keypoint budgets
  scaleFactor: 1.2            # ratio between pyramid levels; smaller = more levels and more cost
  nlevels: 8
  edgeThreshold: 31           # margin ignored at the border, matches patchSize
  firstLevel: 0
  WTA_K: 2                    # points per binary test; 2 keeps the usual Hamming distance
  scoreType: 0                # 0 = cv2.ORB_HARRIS_SCORE (better ranking), 1 = FAST_SCORE (faster)
  patchSize: 31               # BRIEF descriptor window
  fastThreshold: 20           # FAST detector threshold

akaze:
  # AKAZE has no nfeatures parameter: create_detector logs this and detect.py
  # truncates by response to the same cap, so the budget stays equal to the others.
  descriptor_type: 5          # 5 = cv2.AKAZE_DESCRIPTOR_MLDB (binary, 61 bytes)
  descriptor_size: 0          # 0 = full MLDB size
  descriptor_channels: 3
  threshold: 0.001            # detector threshold; smaller = more keypoints
  nOctaves: 4
  nOctaveLayers: 4
  diffusivity: 1              # 1 = cv2.KAZE_DIFF_PM_G2
