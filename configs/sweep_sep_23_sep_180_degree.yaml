# =============================================================================
# sweep
#   python main.py sweep --config configs/sweep_sep_23_sep_180_degree.yaml
#
# Roda cada config de `configs` pelo `pipeline`, com `override` mesclado por cima
# de cada uma (merge recursivo, o override vence, como em `extends`). Os arquivos
# de configs/ nao sao editados: trocar de cena ou de pasta de saida e so aqui.
# =============================================================================

configs:                      # caminhos ou globs, relativos a raiz do repo
  - configs/default.yaml
  - configs/experiments/bundle_off.yaml
  - configs/experiments/bundle_on.yaml
  - configs/experiments/det_akaze.yaml
  - configs/experiments/det_orb.yaml
  - configs/experiments/det_sift.yaml
  - configs/experiments/focal_estimated.yaml
  - configs/experiments/focal_exif.yaml
  - configs/experiments/graph_default.yaml
  - configs/experiments/graph_loose.yaml
  - configs/experiments/graph_strict.yaml
  - configs/experiments/match_brute_force.yaml
  - configs/experiments/match_flann.yaml
  - configs/experiments/proj_cylindrical.yaml
  - configs/experiments/proj_planar.yaml
  - configs/experiments/proj_spherical.yaml
  - configs/experiments/ransac_magsac.yaml
  - configs/experiments/ransac_plain.yaml
  - configs/experiments/ref_center.yaml
  - configs/experiments/ref_first.yaml
  - configs/experiments/ref_index.yaml
  - configs/experiments/reference_loftr.yaml
  - configs/experiments/reference_superglue.yaml
  - configs/experiments/reference_superpoint.yaml
  - configs/experiments/sift_vs_orb_vs_akaze.yaml
  - configs/experiments/strategy_all_pairs.yaml
  - configs/experiments/strategy_sequential.yaml
  - configs/experiments/wave_horiz.yaml
  - configs/experiments/wave_none.yaml
  - configs/experiments/wave_vert.yaml
  # scene_360 fica de fora: a cena e de 180 graus, e com o override de
  # input_dir ela vira identica a bundle_on (a unica diferenca era a pasta)

override:
  data:
    input_dir: data/processed/sep_23_sep_180_degree   # saida do convert, nao os HEIC originais
  run:
    output_root: /Users/oliveira_mats/sep_23_sep_180_degree/results
    artifacts_root: /Users/oliveira_mats/sep_23_sep_180_degree/artifacts
