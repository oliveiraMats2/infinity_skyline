# =============================================================================
# sweep
#   python main.py sweep --config configs/sweep.yaml
#
# Runs each config in `configs` through `pipeline`, with `override` merged on top
# of each one (recursive merge, the override wins, as in `extends`). The files
# in configs/ are not edited: switching scene or output folder happens only here.
# =============================================================================

configs:                      # paths or globs, relative to the repo root
  - configs/default.yaml
  - configs/experiments/*.yaml

override:
  data:
    input_dir: data/processed/panoramic_23_sep   # output of convert, not the original HEICs
  run:
    output_root: /Users/oliveira_mats/panoramic_23_sep/results
    artifacts_root: /Users/oliveira_mats/panoramic_23_sep/artifacts
