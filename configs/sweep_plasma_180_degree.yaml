# =============================================================================
# sweep
#   python main.py sweep --config configs/sweep_plasma_180_degree.yaml
#
# Runs each config in `configs` through `pipeline`, with `override` merged on top
# of each one (recursive merge, the override wins, as in `extends`). The files
# in configs/ are not edited: switching scene or output folder happens only here.
# =============================================================================

configs:                      # paths or globs, relative to the repo root
  - configs/default.yaml
  - configs/experiments/bundle_off.yaml
  - configs/experiments/bundle_on.yaml
  - configs/experiments/det_akaze.yaml
  - configs/experiments/det_orb.yaml
  # - configs/experiments/det_sift.yaml               # [optimized 24/09] left out: exploratory axis, answers no report item
  # - configs/experiments/focal_estimated.yaml        # [optimized 24/09] left out: exploratory axis, answers no report item
  # - configs/experiments/focal_exif.yaml             # [optimized 24/09] left out: exploratory axis, answers no report item
  # - configs/experiments/graph_default.yaml          # [optimized 24/09] left out: exploratory axis, answers no report item
  # - configs/experiments/graph_loose.yaml            # [optimized 24/09] left out: exploratory axis, answers no report item
  # - configs/experiments/graph_strict.yaml           # [optimized 24/09] left out: exploratory axis, answers no report item
  - configs/experiments/match_brute_force.yaml
  # - configs/experiments/match_flann.yaml            # [optimized 24/09] left out: exploratory axis, answers no report item
  # - configs/experiments/proj_cylindrical.yaml       # [optimized 24/09] left out: exploratory axis, answers no report item
  - configs/experiments/proj_planar.yaml
  - configs/experiments/proj_spherical.yaml
  # - configs/experiments/ransac_magsac.yaml          # [optimized 24/09] left out: exploratory axis, answers no report item
  # - configs/experiments/ransac_plain.yaml           # [optimized 24/09] left out: exploratory axis, answers no report item
  # - configs/experiments/ref_center.yaml             # [optimized 24/09] left out: exploratory axis, answers no report item
  # - configs/experiments/ref_first.yaml              # [optimized 24/09] left out: exploratory axis, answers no report item
  # - configs/experiments/ref_index.yaml              # [optimized 24/09] left out: exploratory axis, answers no report item
  - configs/experiments/reference_loftr.yaml
  - configs/experiments/reference_superglue.yaml
  - configs/experiments/reference_superpoint.yaml
  # - configs/experiments/sift_vs_orb_vs_akaze.yaml   # [optimized 24/09] left out: exploratory axis, answers no report item
  # - configs/experiments/strategy_all_pairs.yaml     # [optimized 24/09] left out: exploratory axis, answers no report item
  # - configs/experiments/strategy_sequential.yaml    # [optimized 24/09] left out: exploratory axis, answers no report item
  # - configs/experiments/wave_horiz.yaml             # [optimized 24/09] left out: exploratory axis, answers no report item
  # - configs/experiments/wave_none.yaml              # [optimized 24/09] left out: exploratory axis, answers no report item
  # - configs/experiments/wave_vert.yaml              # [optimized 24/09] left out: exploratory axis, answers no report item
  # scene_360 left out: with the input_dir override it becomes identical to bundle_on

resume: true                  # [optimized 24/09] skips only configs that finished (results/<config>/pipeline.done); an interrupted one is redone in full

override:
  data:
    input_dir: data/processed/plasma_180_degree   # output of convert, not the original HEICs
  run:
    output_root: /Users/oliveira_mats/plasma_180_degree/results
    artifacts_root: /Users/oliveira_mats/plasma_180_degree/artifacts
