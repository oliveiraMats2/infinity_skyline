# Experimento da Etapa de avaliacao: SIFT vs ORB vs AKAZE, FLANN vs forca bruta.
# Herda configs/default.yaml (merge recursivo, o que estiver aqui vence). Tudo que
# nao aparece abaixo fica exatamente como no default, inclusive a cena de entrada.
extends: ../default.yaml

run:
  id: bench_detectors         # saida fixa em results/bench_detectors/
  log_level: DEBUG            # mostra parametro descartado por detector e par rejeitado

detection:
  repetitions: 30             # 30 repeticoes em vez de 10: comparacao de tempo precisa de media estavel
  params:
    nfeatures: 5000           # teto unico para todos, senao a diferenca medida seria orcamento de keypoints

evaluate:
  detectors:
    - sift
    - orb
    - akaze
  matchers:
    - flann
    - brute_force
  per_detector_params:        # presets copiados de configs/detectors.yaml
    sift:
      nfeatures: 5000
      nOctaveLayers: 3
      contrastThreshold: 0.04
      edgeThreshold: 10
      sigma: 1.6
    orb:
      nfeatures: 5000
      scaleFactor: 1.2
      nlevels: 8
      edgeThreshold: 31
      firstLevel: 0
      WTA_K: 2
      scoreType: 0            # cv2.ORB_HARRIS_SCORE
      patchSize: 31
      fastThreshold: 20
    akaze:
      descriptor_type: 5      # cv2.AKAZE_DESCRIPTOR_MLDB; AKAZE nao aceita nfeatures, a truncagem e feita em detect.py
      descriptor_size: 0
      descriptor_channels: 3
      threshold: 0.001
      nOctaves: 4
      nOctaveLayers: 4
      diffusivity: 1          # cv2.KAZE_DIFF_PM_G2

visualize:
  matches:
    max_lines: 50             # com 5000 keypoints por imagem, 100 linhas ja escondem a figura
