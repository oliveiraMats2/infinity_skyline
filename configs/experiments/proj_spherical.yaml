# =============================================================================
# proj_spherical
#   axis     : compose.projection
#   variant  : spherical
#   output   : results/proj_spherical/
#
# Full copy of configs/default.yaml, with ONE SINGLE line changed (marked
# with 'axis of this copy'). No inheritance: this file reads on its own.
#
# Spherical. Needed when the sweep also moves up and down, not only rotates.
# =============================================================================

# Base configuration of infinity-skyline.
# Mirrors the schemas of src/infinity_skyline/config.py field by field, always with the
# schema default value. The models use extra="forbid": any extra key
# here breaks validation, so do not invent fields.
# configs/experiments/ holds FULL COPIES of this file, one per axis of variation,
# each with a single field changed. No inheritance: each copy reads on its own.

# Run identity and discipline: where to write, with which seed, how verbose to be.
run:
  id: null                    # null = uses THIS FILE'S NAME; artifacts go to results/<id>/
                              # so configs/experiments/det_orb.yaml writes to results/det_orb/
  output_root: results        # output root; run_dir() = output_root / id
  artifacts_root: artifacts   # every table becomes a CSV in artifacts/<id>/, with the method as the name prefix
  seed: 42                    # fixed seed: RANSAC samples randomly, without it the number of inliers changes on every run
  log_level: INFO             # DEBUG shows every skipped image, discarded pair and ignored parameter
  overwrite: false            # false protects an existing results/<id>/
  cache: true                 # reuses the keypoint and match .npz files already computed, which makes rerunning only the final stage cheap

# One folder = one scene. The pipeline runs on ONE scene at a time.
data:
  # This is the folder of already converted PNGs, that is, the OUTPUT of `convert`, not the RAW source.
  # `convert` does not read the source from here, it goes in --source:
  #   python main.py convert --config configs/default.yaml --source data/high_bright
  input_dir: data/processed/high_bright
  intruders_dir: null         # pointing to another scene folder (for example data/processed/360_graus_images) injects foreign images and tests the Stage 4 rejection
  extensions:
    - .png                    # `convert` writes lossless PNG; reading .CR2 here would work, but would pay the rawpy cost on every repetition
  grayscale: true             # SIFT, ORB and AKAZE work on one channel; converting once at load avoids reconverting inside the timing loop
  max_dimension: 1600         # longer side in pixels; changing this value invalidates any earlier comparison, because keypoint count, detection time and reprojection error all scale with resolution

# Detector used in generation mode (evaluate mode ignores this and sweeps evaluate.detectors).
detection:
  name: sift
  params: {}                  # empty = OpenCV defaults; to compare detectors use the SAME nfeatures for all three, otherwise the measured difference is just keypoint budget, not detector quality
  repetitions: 1              # [optimized 24/09] was 10; timing is only read in evaluate, which uses sift_vs_orb_vs_akaze.yaml with repetitions
  warmup: 0                   # [optimized 24/09] was 2; with no timing, there is nothing to warm up

# How the descriptors of two images are matched against each other.
matching:
  name: flann                 # flann is approximate and fast; brute_force is exact and serves as the reference
  flann:
    float_descriptors: {}     # empty = default KDTREE block for SIFT (float32 descriptor)
    binary_descriptors: {}    # empty = default LSH block for ORB and AKAZE (uint8 descriptor); KDTREE does not work with Hamming distance
    checks: 50                # leaves visited per query; more checks = more accurate and slower
  brute_force:
    cross_check: false        # must be false: cross_check is mutually exclusive with knnMatch(k=2), and Lowe's ratio test needs the 2 nearest neighbors. The schema rejects true
  strategy: all_pairs         # all_pairs discovers the real scene topology (and the adjacencies of the 360 degree loop closure); sequential only links consecutive neighbors

# Pruning of raw matches before geometry.
filters:
  lowe_ratio: 0.75            # accepts the best neighbor only if it is 25% better than the second; lower = cleaner and fewer matches
  min_matches: 10             # below this the pair does not even reach RANSAC (a homography needs 4 points, but 4 with no slack is fitting noise)

# Geometric model estimated per pair.
geometry:
  model: homography           # panoramic scene rotating around the optical center: the relation between views is a homography. `fundamental` defines no warp and the schema blocks composition
  ransac:
    method: USAC_MAGSAC       # MAGSAC does not depend on a hard inlier threshold, which makes it more stable than classic RANSAC
    reproj_threshold: 3.0     # reprojection error in pixels to count as an inlier
    max_iters: 5000
    confidence: 0.995

# Stage 4: connectivity graph between the images of the scene.
graph:
  min_inliers: 30             # blocks a pair whose overlap is too small: few inliers, even if almost all matches agree
  min_inlier_ratio: 0.25      # blocks a pair whose consensus is weak: many matches, but most are noise that RANSAC discarded
  build_order: true           # infers the panoramic sweep order from the graph diameter (longest shortest path)
  reject_isolated: true       # everything outside the largest connected component is an intruder from another scene

# Stages 5 and 6: warp, seam and blending of the mosaic.
compose:
  reference: center           # reference frame in the middle of the sequence: spreads the accumulated distortion to both sides instead of concentrating it at one end
  projection: spherical       # axis of this copy
  canvas_max: 20000           # canvas ceiling in pixels, against a degenerate homography that would blow up memory. It must fit the legitimate mosaic: 8 frames of 1600 px in cylindrical give ~12300 px of width
  canvas_max_megapixels: 40   # [limit 24/09] pixel budget of the canvas: past it the config fails with a clear error instead of the OS killing the whole sweep for memory (a planar 180 degree sweep reached 88 MP and was killed on 24 GB); see future_works.md item 9
  # Focal length used to build the intrinsics in the non planar projection: it decides at what
  # angular distance each frame lands on the cylinder. Estimating the focal length from the
  # homographies is ill conditioned under small rotation (on this scene the estimate gave
  # 3471 px against the real 1291 px, 2.7x, and opened holes between the frames), so
  # declare the camera when it is known. focal_px takes priority over the mm pair.
  focal_px: null            # focal length directly in pixels; null = uses the pair below
  focal_mm: 18.0            # EXIF of the images: 18 mm lens
  sensor_width_mm: 22.3     # APS-C sensor of the Canon EOS Rebel T5i
  # Straightens the horizon: brings the roll accumulated along the sweep back to
  # zero, so the panorama stops bending and the far end does not come out crooked. Only has an effect
  # when `projection` is not planar, because only then does the pipeline build rotations.
  # Wave correction: straightens the horizon by rotating all cameras as a block.
  # Measured on this scene: horizon tilt of +0.62 degrees with it against +0.81 without, and
  # a flatter horizon (91 px of deviation against 95). The gain is small because the
  # rotations come from chained homographies and not from bundle adjustment; reassess when
  # future_works item 2 lands. Options: horiz | vert | none. Only applies to non planar.
  wave_correct: horiz
  bundle_adjust: false        # true = refines rotations and focal length jointly over ALL graph edges (global adjustment) instead of relying only on pairwise chaining; closes the 360 loop
  seam:
    finder: graphcut          # graphcut finds the cut with the lowest color cost; dp_color is faster and worse
    scale: 0.25               # the seam runs at reduced scale because graph cut is O(pixels) and the cut line is a low frequency structure: finding it at 1/4 and rescaling gives the same cut for a fraction of the time and memory
  blend:
    method: multiband         # multiband dissolves the seam per frequency band; feather makes a narrow ramp at the seam; linear weights the whole overlap by distance to the border
    bands: 5
    sharpness: 0.02           # used only by feather
    compare: [feather, linear, multiband]   # one panorama_<method>.png and one <method>_blending_metrics.csv per technique, all on the same seam
  exposure: gain_blocks       # block based exposure compensation: the low_bright and high_bright folders prove the same view arrives with different brightness, and a single global gain corrects neither vignetting nor variation within the frame
  save_naive: true            # also saves the plain average without a seam, which is the deghosting comparison of Stage 6.4
  save_equirectangular: false # 360 degree sweeps only: writes panorama/panorama_equirectangular.jpg (2:1, GPano XMP) for 3D viewers such as Spherical Viewer; turned on by configs/sweep_360_plasma_images.yaml and scene_360.yaml

# Evaluate mode: sweeps the detectors x matchers matrix and produces metrics.csv.
evaluate:
  detectors:
    - sift
    - orb
    - akaze
  matchers:
    - flann
    - brute_force
  metrics:
    - n_keypoints             # how many points the detector returned
    - detect_time_ms          # mean detectAndCompute time
    - descriptor_bytes        # bytes per descriptor: SIFT 512, ORB 32, AKAZE 61
    - spatial_dispersion      # spread of the points over the image; low = clustered in a corner
    - raw_matches             # matches before Lowe's test
    - filtered_matches        # matches after Lowe's test
    - match_time_ms
    - n_inliers               # matches that survived RANSAC
    - inlier_ratio            # n_inliers / filtered_matches, the main metric
    - reprojection_rmse       # residual error of the homography, in pixels
    - success_rate            # fraction of pairs that produced a valid homography
  per_detector_params: {}     # per detector blocks; see configs/detectors.yaml and the sift_vs_orb_vs_akaze experiment
  export:
    csv: true
    markdown_table: true
    plots: true

# Generation mode figures.
visualize:
  keypoints:
    enabled: true
    rich: true                # draws the size and orientation of each keypoint, not just a dot
    max_draw: 500             # drawing 5000 points turns into an unreadable blob
    color: [0, 255, 0]        # BGR
  matches:
    enabled: true
    before_after: true        # raw vs filtered panel, which is what shows Lowe's test at work
    max_lines: 100
    inliers_only: false
  graph:
    enabled: true
    layout: spring
    annotate_weights: true    # writes the number of inliers on each edge
  progressive:
    fast: true                # [optimized 24/09] progressive alignment steps (5.4) without graph cut and without exposure: they were ~75% of the time of each run; the final panorama stays complete
  figures:
    dpi: 150
    format: png
